name: Identity Forge CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 24.18.0
      PNPM_VERSION: 10.11.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Enable pnpm
        run: corepack prepare pnpm@${PNPM_VERSION} --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Build and artifact gate
        run: pnpm build:verified
      - name: Wrangler dry run
        run: pnpm exec wrangler deploy --dry-run
