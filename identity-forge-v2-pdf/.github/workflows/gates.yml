name: CI/CD Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  gate-0-genesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Genesis
        run: |
          if [ ! -f "PROJECT_GENESIS.yaml" ]; then
            echo "❌ PROJECT_GENESIS.yaml not found"
            exit 1
          fi

  gate-2-deps:
    runs-on: ubuntu-latest
    needs: gate-0-genesis
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

  gate-3-typecheck:
    runs-on: ubuntu-latest
    needs: gate-2-deps
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Type Check
        run: pnpm tsc --noEmit

  gate-4-tests:
    runs-on: ubuntu-latest
    needs: gate-2-deps
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run Tests
        run: pnpm test

  gate-7-build:
    runs-on: ubuntu-latest
    needs: [gate-3-typecheck, gate-4-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: apps/web/dist/

  gate-8-deploy-dry-run:
    runs-on: ubuntu-latest
    needs: gate-7-build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Download Build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: apps/web/dist
      - name: Deploy Dry-Run
        run: |
          cd apps/web
          npx wrangler deploy --dry-run
